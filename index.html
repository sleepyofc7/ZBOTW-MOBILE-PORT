<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1a1f">
  <title>LINKS</title>

  <!-- Fontes elegantes (precisam de internet no site publicado) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sheikah: #6be8f5;            /* azul-ciano da Sheikah Slate */
      --sheikah-soft: rgba(107,232,245,.55);
      --slate: rgba(8, 24, 30, .72);
      --slate-line: rgba(107,232,245,.38);
      --parchment: #efe6cf;
      --text: #f3f0e4;
      --muted: rgba(239,230,207,.78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 105px 22px 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      /* Coloque fundo.png na mesma pasta. Se não existir, usa o céu de Hyrule. */
      background:
        linear-gradient(180deg, rgba(5,18,24,.55), rgba(5,18,24,.25) 45%, rgba(5,18,24,.75)),
        url("./fundo.png") center / cover fixed no-repeat,
        linear-gradient(180deg, #a9d4cf 0%, #5f9c93 45%, #1d4a4a 100%);
      overflow-x: hidden;
    }

    /* Luz suave, como o amanhecer em Hyrule */
    body::before {
      content: "";
      position: fixed;
      inset: -10%;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 22%, rgba(255,244,206,.28), transparent 42%),
        radial-gradient(circle at 50% 100%, rgba(107,232,245,.14), transparent 55%);
      animation: breathe 9s ease-in-out infinite alternate;
    }

    .home-button {
      position: fixed;
      z-index: 5;
      top: 24px;
      left: 24px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      color: var(--sheikah);
      text-decoration: none;
      border: 1px solid var(--slate-line);
      border-radius: 50%;
      background: var(--slate);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 0 0 4px rgba(107,232,245,.08), 0 8px 26px rgba(0,0,0,.35);
      transition: box-shadow .3s ease, background .3s ease, transform .3s ease;
    }

    .home-button:hover {
      background: rgba(107,232,245,.18);
      box-shadow: 0 0 0 4px rgba(107,232,245,.18), 0 0 26px rgba(107,232,245,.55);
      transform: scale(1.06);
    }

    .home-button svg { width: 22px; height: 22px; }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 600px);
      text-align: center;
    }

    .eye {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      color: var(--sheikah);
      filter: drop-shadow(0 0 10px rgba(107,232,245,.75));
    }

    .eyebrow {
      margin: 0 0 10px;
      font-family: "Cinzel", Georgia, serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .4em;
      color: var(--sheikah);
      text-shadow: 0 0 12px rgba(107,232,245,.6);
    }

    h1 {
      margin: 0;
      font-family: "Cinzel", Georgia, serif;
      font-size: clamp(30px, 6.5vw, 50px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: .08em;
      text-wrap: balance;
      color: var(--parchment);
      text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 4px 30px rgba(0,0,0,.55);
    }

    /* Divisor fino com losango no meio */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px auto 38px;
      max-width: 340px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sheikah-soft));
    }

    .divider::after { transform: scaleX(-1); }

    .divider span {
      width: 9px;
      height: 9px;
      background: var(--sheikah);
      transform: rotate(45deg);
      box-shadow: 0 0 12px var(--sheikah);
    }

    .links { display: grid; gap: 16px; }

    .link-card {
      position: relative;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 24px;
      color: var(--text);
      text-align: left;
      text-decoration: none;
      border: 1px solid var(--slate-line);
      border-radius: 6px;
      background: var(--slate);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      backdrop-filter: blur(16px) saturate(130%);
      box-shadow: inset 0 0 24px rgba(107,232,245,.06), 0 12px 30px rgba(0,0,0,.3);
      transition: border-color .3s ease, box-shadow .3s ease, background .3s ease;
      animation: emerge .8s both;
    }

    /* Cantos no estilo menu da Sheikah Slate */
    .link-card::before,
    .link-card::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--sheikah);
      opacity: .9;
      transition: width .3s ease, height .3s ease;
    }

    .link-card::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
    .link-card::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }

    .link-card:hover,
    .link-card:focus-visible {
      outline: none;
      background: rgba(12, 52, 60, .78);
      border-color: var(--sheikah);
      box-shadow: inset 0 0 28px rgba(107,232,245,.16), 0 0 26px rgba(107,232,245,.38), 0 12px 30px rgba(0,0,0,.3);
    }

    .link-card:hover::before,
    .link-card:hover::after,
    .link-card:focus-visible::before,
    .link-card:focus-visible::after { width: 24px; height: 24px; }

    .link-name {
      font-family: "Cinzel", Georgia, serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: .1em;
    }

    .arrow {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--sheikah);
      border: 1px solid var(--slate-line);
      border-radius: 50%;
      font-family: system-ui, sans-serif;
      font-size: 17px;
      transition: background .3s ease, color .3s ease, box-shadow .3s ease;
    }

    .link-card:hover .arrow,
    .link-card:focus-visible .arrow {
      background: var(--sheikah);
      color: #062026;
      box-shadow: 0 0 16px var(--sheikah);
    }

    footer {
      margin: 36px auto 0;
      max-width: 500px;
      color: var(--muted);
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
      text-shadow: 0 2px 14px rgba(0,0,0,.7);
    }

    footer strong {
      color: var(--sheikah);
      font-family: "Cinzel", Georgia, serif;
      font-size: 14px;
      letter-spacing: .2em;
    }

    @keyframes emerge {
      from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes breathe {
      from { opacity: .75; }
      to   { opacity: 1; }
    }

    @media (max-width: 520px) {
      body { padding: 105px 18px 40px; background-attachment: scroll; }
      .home-button { top: 17px; left: 17px; width: 49px; height: 49px; }
      .link-card { min-height: 66px; padding: 0 18px; }
      .link-name { font-size: 14px; letter-spacing: .07em; }
      footer { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Troque o endereço abaixo pelo endereço do seu outro site. -->
  <a class="home-button" href="https://beacons.ai/sleepyofc7/principal" aria-label="Ir para meu outro site" title="Voltar">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.5 10.6 12 3.8l8.5 6.8v9.1a1.3 1.3 0 0 1-1.3 1.3h-5.1v-6.2h-4.2V21H4.8a1.3 1.3 0 0 1-1.3-1.3v-9.1Z"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <main>
    <!-- Olho Sheikah -->
    <svg class="eye" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 30C14 16 24 11 32 11s18 5 28 19c-10 14-20 19-28 19S14 44 4 30Z"/>
      <circle cx="32" cy="30" r="8"/>
      <circle cx="32" cy="30" r="2.5" fill="currentColor"/>
      <path d="M32 49v10M32 59l-6 0M32 59l6 0"/>
      <path d="M14 22 8 14M50 22l6-8"/>
    </svg>

    <p class="eyebrow">LINKS</p>
    <h1>The Legend of Zelda<br>Breath of the Wild Port Mobile</h1>
    <div class="divider" aria-hidden="true"><span></span></div>

    <nav class="links" id="links" aria-label="Meus links"></nav>

    <footer><strong>AVISO:</strong> Tenha bastante espaço de armazenamento livre para evitar problemas durante a instalação.</footer>
  </main>

  <script>
    // Edite esta lista para adicionar, remover ou alterar seus links.
    const links = [
      { name: "DOWNLOAD DO APK", url: "https://github.com/mamcjr/BOTWRecompAndroid/releases/download/v0.5.0-beta/BOTWRecompAndroid-0.5.0-beta.apk" },
      { name: "DATA / ARQUIVOS EXTRAS (17GB Compactado)", url: "https://gofile.io/d/2vJF178o" },
    ];

    const container = document.getElementById("links");

    links.forEach((item, index) => {
      const a = document.createElement("a");
      a.className = "link-card";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.animationDelay = `${index * 140}ms`;

      const name = document.createElement("span");
      name.className = "link-name";
      name.textContent = item.name;

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "↗";

      a.append(name, arrow);
      container.appendChild(a);
    });
  </script>
</body>
</html>
